[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memhunter"
version = "1.0.0"
description = "Ephemeral Sandbox Memory Dump Downloader & Forensic Intelligence Carver for Infostealers and RATs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SF1.0 Threat Intelligence" }]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.20.0",
    "pydantic>=2.0.0",
]

[project.scripts]
kinetic-memhunter = "kinetic_memhunter.cli:main"

[tool.setuptools.packages.find]
include = ["memhunter*", "kinetic_memhunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
